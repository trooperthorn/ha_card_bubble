name: Validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
  schedule:
    # Weekly, so toolchain and HACS validation drift surfaces without a push.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, resolved 2026-09-08
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, resolved 2026-09-08
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - run: python3 scripts/build_release_artifacts.py --validate-only

  dist-in-sync:
    # HACS installs this card from the dist/ folder of the tagged tree (releases
    # deliberately have no assets, see docs/decisions.md), so
    # the committed dist is the product. Drift from a fresh build fails CI.
    name: Committed dist matches a fresh build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, resolved 2026-09-08
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, resolved 2026-09-08
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - name: Fail on drift
        run: |
          if ! git diff --exit-code -- dist || [ -n "$(git status --porcelain -- dist)" ]; then
            echo "dist/ is stale or has untracked files: run npm run dist and commit the result" >&2
            git status --short -- dist >&2
            exit 1
          fi
      - name: No removed or unregistered elements in the bundle
        # build/formfield-loader.cjs renames ha-formfield (removed in Home
        # Assistant 2026.11) to the fork's bubble-formfield, and mwc-button /
        # mwc-icon-button (no longer registered) to ha-button / ha-icon-button.
        # The --ha-formfield-* CSS custom properties are intentionally kept.
        run: |
          if grep -lP '(?<![\w-])(ha-formfield|mwc-button|mwc-icon-button)(?![\w-])' dist/*.js; then
            echo "dist still references an element Home Assistant no longer provides" >&2
            exit 1
          fi
      - name: Enforce the startup bundle budget
        # The entry file is what every client parses at startup: 1,073,092
        # bytes at upstream v3.4.1, 736,165 with the editor loaded on demand,
        # 696,988 with the stylesheets minified, 585,318 with js-yaml and the
        # pop-up onboarding loaded on demand. See docs/decisions.md.
        run: |
          SIZE="$(wc -c < dist/bubble-card.js)"
          echo "dist/bubble-card.js is ${SIZE} bytes"
          if [ "$SIZE" -gt 614400 ]; then
            echo "dist/bubble-card.js exceeds the 600 KiB budget" >&2
            exit 1
          fi

  hacs:
    # Informational: hacs/action also enforces default-store requirements
    # (repository description, topics) that are GitHub settings, not repo content.
    name: HACS validation (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, resolved 2026-09-08
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main HEAD, resolved 2026-09-08 (hacs/action publishes no release tags)
        with:
          category: plugin
